[project]
name = "nche-api"
version = "0.1.0"
description = "Explainable account-takeover risk intelligence API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.6",
  "pydantic-settings>=2.7.1",
  "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28.1",
  "pytest>=8.3.4",
  "ruff>=0.8.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
